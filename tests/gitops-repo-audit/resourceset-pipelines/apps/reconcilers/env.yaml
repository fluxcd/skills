apiVersion: v1
kind: Namespace
metadata:
  name: apps-test
  labels:
    toolkit.fluxcd.io/tenant: apps
---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: apps-test
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileTimeout: "10m"
spec:
  wait: true
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: infra-controllers
      namespace: flux-system
      ready: true
  resources:
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: flux-vars
        namespace: apps-test
        annotations:
          fluxcd.controlplane.io/copyFrom: "flux-system/flux-vars"
        labels:
          reconcile.fluxcd.io/watch: Enabled
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-egress
        namespace: apps-test
      spec:
        podSelector: {}
        policyTypes:
          - Egress
        egress:
          - {}
