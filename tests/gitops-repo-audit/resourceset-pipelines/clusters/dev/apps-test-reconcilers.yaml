apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-test-reconcilers
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 5m
  timeout: 5m
  prune: true
  wait: false
  sourceRef:
    kind: OCIRepository
    name: flux-system
  path: ./apps/reconcilers
  postBuild:
    substitute:
      app_env: "test"
      app_semver: ">=1.0.0"
    substituteFrom:
      - kind: ConfigMap
        name: flux-vars
